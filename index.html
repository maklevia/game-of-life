<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mariia's Game of Life</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
<header>
    <h1>Mariia's Game of Life</h1>
</header>
<div style="background-color: #C1CfA1; padding: 20px "><div class="wrapper"></div></div>

<div class="actions">
    <div class="sizeActions">
        <div class="sizeCounter"></div>
        <button class="sizeButton" id="increase">+</button>
        <button class="sizeButton" id="decrease">-</button>
    </div>
    <div class="playActions">
        <button class="playButton" id="random">Randomized Grid</button>
        <button class="playButton" id="start"><span id="startIcon">&#9658</span> Start</button>
        <button class="playButton" id="stop"><span id="stopIcon">&#9208</span> Stop</button>
        <button class="playButton" id="reset">&#8634 Reset</button>
    </div>
</div>
</body>
</html>
