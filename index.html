<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mariia's Game of Life</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
<header>
    <h1>Mariia's Game of Life</h1>
</header>
<div class="main-container">
    <div class="wrapper"></div>
    <div class="under-wrapper">
        <div class="color-change">
            <div style="display: flex; flex-direction: row; align-items: center; justify-content: center;">
                <div class="color-choosing">
                    <label for="color-alive">Color for alive cells:</label>
                    <input type="color" id="color-alive" value="#FF748B">
                </div>
                <div class="color-choosing">
                    <label for="color-dead">Color for dead cells:</label>
                    <input type="color" id="color-dead" value="#EDE8DC">
                </div>
            </div>
            <button class="playButton" id="color-button">Apply</button>
        </div>
        <div class="copy-paste-actions">
            <button class="playButton" id="copy">Copy Grid</button>
            <button class="playButton" id="paste">Paste Grid</button>
        </div>
    </div>
</div>

<div class="actions">
    <div class="sizeActions">
        <div class="sizeCounter">
            <label for="field">Grid size: </label>
            <input id="field" type="number" min="2" max="50">
        </div>
        <button class="sizeButton" id="increase">+</button>
        <button class="sizeButton" id="decrease">-</button>
    </div>
    <div class="playActions">
        <button class="playButton" id="random">Randomized Grid</button>
        <button class="playButton" id="start"><span id="startIcon">&#9658</span> Start</button>
        <button class="playButton" id="stop"><span id="stopIcon">&#9208</span> Stop</button>
        <button class="playButton" id="reset">&#8634 Reset</button>
    </div>
</div>
</body>
</html>
